# The MK1 is driven from userspace (displays + 62-byte LED block, neither
# of which snd-usb-caiaq provides). A udev unbind rule races the driver's
# own probe on plug-in, so the module is kept out of the way entirely.
#
# blacklist alone is not enough - it only stops *automatic* loading by
# alias, and something else depending on the module would still pull it
# in. install ... /bin/false refuses the load outright.
#
# Remove both lines if this board is ever wanted as a plain caiaq audio
# interface; nothing else here depends on the module.
blacklist snd_usb_caiaq
install snd_usb_caiaq /bin/false
