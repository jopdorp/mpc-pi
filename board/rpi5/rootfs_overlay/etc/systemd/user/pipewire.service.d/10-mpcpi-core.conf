# Core 1, which the kernel cmdline isolates and irqaffinity=0 keeps free of
# interrupts. PipeWire was running on core 0 - shared with every xhci interrupt
# on the board (7.9M and 3.9M on the two controllers), systemd, journald and
# every ssh session - while cores 1 and 2 sat idle. The design has always said
# core 1 belongs to PipeWire's data loop; nothing was enforcing it.
#
# As with the RT limit: moving it to core 1 by hand did not change the emulator
# stream's xrun rate (1305 vs 1242). Shipping it anyway, because the alternative
# is an audio graph competing with the USB interrupt load of the whole machine.
[Service]
CPUAffinity=1
