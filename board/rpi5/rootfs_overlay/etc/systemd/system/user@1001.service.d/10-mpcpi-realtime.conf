# The mpc user's session had NO realtime budget: PipeWire's data-loop thread ran
# SCHED_OTHER with "Max realtime priority: 0" in /proc/PID/limits, while the
# emulator ran SCHED_RR 20 on an isolated core. A realtime producer preempting
# the non-realtime thread that drains its buffer is backwards.
#
# rtkit is not installed, so PipeWire cannot borrow priority from it either; the
# limit has to come from the service manager that starts the session. This is
# the same lesson as the emulator's own LimitRTPRIO - PAM limits in
# /etc/security/limits.d never reach a systemd service - applied one level up,
# to the USER MANAGER rather than to a unit.
#
# Honesty about what this did and did not fix: raising the data loop to
# SCHED_FIFO 88 by hand did NOT reduce the emulator stream's xruns (1242 -> 1480,
# i.e. unchanged within noise), so this is not the cause of the crackle. It is
# still wrong to ship a graph that cannot get realtime priority.
[Service]
LimitRTPRIO=95
LimitMEMLOCK=infinity
LimitNICE=-19
