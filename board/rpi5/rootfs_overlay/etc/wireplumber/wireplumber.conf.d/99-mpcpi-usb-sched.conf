# The USB gadget's ALSA node: interrupt-driven, one hardware period per
# graph cycle, same reasoning as 98-mpcpi-external-usb-audio.conf for the
# monitoring codec.
#
# PERIOD-SIZE WAS 32. The graph quantum is 64 now (settled after the
# SCHED_RR fix - see docs/audio-chain.md), and disable-tsched requires
# quantum <= period-size: a period smaller than the quantum is the exact
# shape of the fault that stopped the Duo's driver dead when a mismatched
# quantum was requested against its period. Raised to 64 to match, rather
# than leaving a mismatch in place on the theory that a non-driving node
# might tolerate it - untested, and this project has a standing rule
# against trusting that kind of reasoning over a measurement.
#
# period-num 4 (256 frames, 5.8ms) matches the Duo's own proven-stable
# setting rather than the shallower 2-period design this file used to
# specify. The kernel patch that lowers f_uac2's period floor
# (patches/kernel/0001) still applies if a shallower buffer is retried
# later - measure it the same way the Duo's was measured, not by
# assuming a gadget behaves like a codec.
#
# MUST BE RE-MEASURED before being trusted: this config was inherited from
# an earlier investigation that ran at quantum 32 and was never re-verified
# after the SCHED_RR fix or the quantum settling at 64.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-1000480000.usb.*" }
      { node.name = "~alsa_input.platform-1000480000.usb.*" }
    ]
    actions = {
      update-props = {
        # TIMER-SCHEDULED, NOT INTERRUPT-SCHEDULED - the opposite of the
        # monitoring codec, and for a reason specific to being a gadget.
        #
        # disable-tsched makes PipeWire wait on the DEVICE's period
        # interrupts. A real codec generates those from its own crystal,
        # forever. A USB gadget does not: its playback endpoint only
        # advances when the HOST is actively streaming, so with tsched off
        # there is nothing to wake the node when no computer is recording -
        # and PipeWire cannot pre-fill a buffer it is never scheduled to
        # fill.
        #
        # Measured symptom: the node sat at QUANT 0 / RATE 0 while every
        # other node in the graph showed 64 / 44100, its error counter
        # climbed steadily, and a 26-channel capture taken on the host was
        # digital silence on every channel despite correct links from the
        # correct source port. The same was true at 2 channels, which ruled
        # out channel count.
        #
        # This setting was inherited from an investigation that predates
        # the current graph and was never re-tested against it.
        api.alsa.disable-tsched = false
        api.alsa.period-size = 64
        api.alsa.period-num = 4
        # HEADROOM, not zero. Measured: PipeWire filled exactly one period
        # (appl_ptr stayed 64 frames ahead of hw_ptr) and stopped, so the
        # host received silence because nothing was queued to send. A device
        # that will not start until more than one period is buffered behaves
        # precisely like that, and headroom is what pre-fills it.
        #
        # Zero is right for the monitoring codec, which is a real converter
        # draining continuously from its own crystal. A gadget only drains
        # when a computer is listening, so it needs something in hand before
        # that happens.
        api.alsa.headroom = 128
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
