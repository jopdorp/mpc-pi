# NOTE THE 98. This file MUST sort after 97-mpcpi-driver.conf.
#
# WirePlumber merges every *.conf in this directory in filename order and the
# last writer of a property wins. 97-mpcpi-driver.conf matches "~alsa_.*" -
# every ALSA node, this one included - and sets priority.driver = 100. While
# this file was called 94-, its priority.driver = 6000 was overwritten by that
# 100 before the graph ever started: the node.group from here applied, the
# priority did not, and pw-dump showed driver=100 on a device this file had
# just asked to be 6000. The fix survived a reboot and changed nothing, which
# is the confusing part - the file was correct and simply not last.
#
# If a new drop-in ever needs to touch priority.driver for this device, it has
# to sort after this one, or say so here instead.
# The external USB audio interface is the LOCAL monitoring path - the
# stand-in for the ADC/DAC that will eventually be wired to the I2S header.
#
# So it is not merely tolerated: it carries what the player hears, and its
# output latency matters. An earlier version of this file gave it a
# 256-frame period specifically to keep it out of the way, which is the
# right rule for an accessory and the wrong one for the monitor path.
#
# What it must still NOT do is drive the graph. The appliance's clock is a
# null-audio-sink at a fixed 32-frame quantum and everything follows it; if
# this device won the driver election, the whole graph would reclock to
# whatever a full-speed codec can manage and the instrument's latency would
# depend on what is plugged in. Driver election happens per node.group, so
# keeping it in its own group is what stops it competing at all - low
# priority alone would not.
#
# Period: 256 frames, settled by listening. 64 was tried first and produced
# constant underruns - the device accepted the request and then could not meet
# it, which is why api.alsa.period-size being honoured is not the same as it
# working. Check /proc/asound/cardN/pcm0p/sub0/hw_params for what was
# negotiated, and the pw-top error column for whether it holds.
monitor.alsa.rules = [
  {
    matches = [
      # USB audio class devices, excluding our own UAC2 gadget - that one is
      # the instrument's output to the host and is configured separately.
      # Two conditions in ONE object needs two DIFFERENT keys: this block
      # had node.name twice, and the second silently replaced the first.
      # The gadget is excluded by object.path instead, which is where the
      # platform device is distinguishable.
      {
        node.name = "~alsa_output\\.usb-.*"
      }
      {
        node.name = "~alsa_input\\.usb-.*"
      }
    ]
    actions = {
      update-props = {
        # These two are NOT the same knob, and conflating them broke the
        # monitoring path:
        #
        #   priority.driver  - the CLOCK election. Must stay far below the
        #     null-sink's 5000 so this device can never reclock the graph.
        #     At its default of 1009 it won, and clocked everything at
        #     48000/1024 while the emulator's 44100 was resampled.
        #   priority.session - DEFAULT SINK selection. Setting this low too
        #     stopped the codec being the default, so WirePlumber stopped
        #     auto-linking to it: the codec suspended, and the emulator ran
        #     with nowhere to send audio, logging 133,780 errors.
        #
        # So: never drive, but do be the thing you hear.
        # priority.driver 6000 - ABOVE the null sink's 5000 - and the SAME
        # node.group, so this device wins the clock election and the graph runs
        # on its crystal.
        #
        # This file previously did the exact opposite, on the reasoning written
        # above: never let an accessory reclock the instrument. That reasoning
        # is wrong for a DAC, and the measurement is unambiguous. Same M-Audio
        # Duo, same 32-frame quantum, same emulator:
        #
        #   development host, Duo drives the graph:      ERR 0
        #   appliance, mpcpi-clock drives and Duo follows: 76 xruns / 16s
        #
        # A DAC has its own crystal. Driving the graph from a timer-based null
        # sink means nothing in the system shares a clock with the hardware that
        # finally converts the samples, so PipeWire has to resample to track the
        # drift, and the residue is periodic clicks that appear in a capture of
        # the graph while every PipeWire error counter reads zero. Raising the
        # quantum to 64 and then 256 cut the xruns but never removed the clicks,
        # because the quantum was not the problem.
        #
        # The null sink still exists and still drives when no interface is
        # plugged in, which is what keeps the graph alive on a bare appliance.
        priority.driver  = 6000
        priority.session = 1500
        node.group       = "mpcpi-audio"
        # Never suspend. A monitoring interface that idles into suspend
        # produces a gap the next time something plays through it.
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
        # As low as this device can hold. It is the monitoring path, so its
        # output latency is the latency the player feels when the gadget is
        # not the destination.
        # 256 frames, 3 periods. NOT 64.
        #
        # 64/2 gave a 128-frame total buffer - 2.9ms - on a FULL SPEED device
        # where one USB frame is already ~44 frames at 44.1k. Under three
        # frames of slack, and it underran constantly: audible crackling with
        # the error counter climbing ~19 every five seconds.
        #
        # I set 64 chasing low latency because this interface stands in for the
        # ADC/DAC. That was the right goal on the wrong device: a full-speed
        # codec cannot hold a buffer that small, and crackle is not a latency
        # improvement. The I2S converters this replaces will be a different
        # question entirely - they are not USB and not full speed.
        #
        # 256 x 3 is 17ms of buffer, which for a monitoring path is unremarkable
        # and, unlike 64, actually plays.
        # 512 x 3. The device negotiated 128/384 when asked for 256/3 - it
        # takes its own view - and still dropped 175 samples in eight seconds.
        # Asking for more is the only lever that has moved this: a monitoring
        # path can spend 35ms of buffer, and crackle cannot be traded for
        # latency that the hardware will not deliver anyway.
        api.alsa.period-size = 512
        api.alsa.period-num  = 3
        api.alsa.headroom    = 256
      }
    }
  }
]
