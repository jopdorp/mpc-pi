context.properties = {
    # 44100, because the MPC2000XL is a 44.1kHz machine and always was.
    # A 48k graph puts a resampler in front of every emulator channel -
    # CPU we are trying to save and latency we are trying to remove, to
    # convert audio that started at 44.1 back toward 44.1 at the DAC.
    # allowed-rates keeps a client from renegotiating the graph to 48k
    # mid-session, which is a glitch and a silent resampler both.
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    # 32 samples, 725us, and nothing else. Quantum 48 existed as a
    # fallback while 32 looked unreachable; every reason for it has
    # since been measured away:
    #
    #   * the "delivery defects at 32" were a measurement artifact -
    #     the emulator's audio summed onto the test tone's channels;
    #   * the "sessions die at 32" was a kernel panic in the DAC-less
    #     I2S card, now disabled at the overlay;
    #   * the ~1ms DMA service floor belonged to that same phantom card
    #     and left the graph with it.
    #
    # What remains is the measurement that matters: the FULL desk - 27
    # inserts, sixteen tracks armed, all eight MPC individual-out tracks
    # active, emulator live - at quantum 32, WHICH IS NOT WHAT THIS FILE NOW
    # SETS (see default.clock.quantum below - it is 64). A record of what was
    # measured then, not a description of the running system.
    # With Ardour's own xrun
    # counter reading +0 across eleven consecutive reports and the
    # driver logging zero errors in every window.
    #
    # Pinning min and max to 32 as well, so no client can renegotiate
    # the graph out from under the instrument mid-take.
    # 64 frames, 1.45ms, pinned so nothing can renegotiate it mid-take.
    #
    # The long comment that used to live here explained why the board "cannot
    # reach 32-64 today" and blamed MAME for emitting a whole frame's audio in
    # one burst every 10.9ms. That reading was of the CONSUMER being gated, not
    # the producer bursting: MAME's audio threads sat at the emulation thread's
    # SCHED_RR priority on the same pinned core, so they only ran when emulation
    # happened to block - and 90% of the audio was lost before it reached the
    # graph. docs/audio-chain.md has the measurements. With that fixed the board
    # runs 64 clean: realtime 98.0%, underruns 0, codec xruns flat.
    #
    # MUST equal MPC_PIPEWIRE_FRAMES in mpcpi-emulator.service - run-mpc.sh
    # derives the sound-update cadence from it - and MUST NOT exceed
    # api.alsa.period-size in 98-mpcpi-external-usb-audio.conf while
    # disable-tsched is on, or the graph stops dead at QUANT 0 with nothing
    # reporting an error.
    default.clock.quantum       = 64
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 64
}
context.modules = [
    { name = libpipewire-module-rt
      args = {
          nice.level    = -19
          rt.prio       = 88
          rt.time.soft  = -1
          rt.time.hard  = -1
      }
      flags = [ ifexists nofail ]
    }
]
