# A driver that is only a clock.
#
# Every hardware device on this appliance has now been measured as a
# graph driver and disqualified: the phantom I2S card's DMA cannot
# promise a 726us period and its EPIPE recovery kills the session; the
# USB gadget's cycle follows the connected computer's pull cadence,
# which put Ardour at 1000% load. What quantum 32 needs is a driver
# that ticks exactly on time and cannot die: PipeWire's own timer on
# an RT kernel with the CPU held out of deep idle.
#
# The null sink never touches hardware. The I2S and gadget nodes
# become followers, each rate-matched to it by its own DLL, each free
# to fail and recover without taking the clock down with it.
context.objects = [
  { factory = adapter
    args = {
        factory.name     = support.null-audio-sink
        node.name        = "mpcpi-clock"
        node.description = "MPC-Pi graph clock"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
        audio.rate       = 44100
        priority.driver  = 5000
        node.group       = "mpcpi-audio"
        priority.session = 500
        node.always-process = true
        monitor.channel-volumes = false
    }
  }
]
