# Disable the I2S card entirely.
#
# No DAC is wired to those pins. The card exists because the device-tree
# overlay creates it unconditionally, and its DMA clocks data into
# nothing. Keeping it in the graph cost, in order:
#
#   * a phantom clock. It drove the graph for weeks and its ~1ms DMA
#     service floor was read as the hardware limit on quantum 32.
#   * kernel panics. Captured over netconsole:
#
#       dma dma2chan2: BUG: dma2chan2, IRQ with no descriptors   (x9)
#       Unable to handle kernel paging request at deaddeaddeaddead
#       ...  dma_pool_alloc / axi_desc_get / dw_axi_dma_set_hw_desc
#            / snd_dmaengine_pcm_trigger / snd_pcm_do_start
#       Kernel panic - not syncing: Oops: Fatal exception in interrupt
#
#     A use-after-free in the RP1 DMA driver (deaddeaddeaddead is
#     poisoned freed memory), reached through starting the PCM. Every
#     unexplained reboot in this project traces here: the panic fires on
#     snd_pcm_do_start, which is exactly what a graph restart does, and
#     the board was restarting its graph all day.
#
# The instrument's audio goes out over USB. Until a DAC is actually
# fitted, this card is a liability with no function, so it is removed
# from the session rather than merely deprioritised.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_.*platform-soc_107c000000_sound.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
