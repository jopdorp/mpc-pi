# Static download page for the MPC-Pi desktop bundles, for the home
# MicroK8s cluster. Files live on a PVC so they survive pod restarts; the
# landing page is a ConfigMap regenerated by scripts/k8s/publish-download.sh
# on every publish. The nginx autoindex on /files/ means a raw file dropped
# on the volume is reachable even before the landing page names it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mpcpi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: download-files
  namespace: mpcpi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: download-nginx
  namespace: mpcpi
data:
  default.conf: |
    server {
      listen 80;
      location /files/ {
        alias /usr/share/nginx/html/files/;
        autoindex on;
      }
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: download-site
  namespace: mpcpi
data:
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><title>MPC-Pi downloads</title></head>
    <body><h1>MPC-Pi downloads</h1>
    <p>No bundles published yet; run scripts/k8s/publish-download.sh.</p>
    <p><a href="files/">Raw file listing</a></p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: download
  namespace: mpcpi
spec:
  replicas: 1
  # A single RWO volume cannot be shared by a rolling replacement pair.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: download
  template:
    metadata:
      labels:
        app: download
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: files
              mountPath: /usr/share/nginx/html/files
            # Directory mounts, not subPath files: the kubelet subPath bind
            # for ConfigMap keys failed on this cluster with "not a directory".
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: download-files
        - name: nginx-conf
          configMap:
            name: download-nginx
        - name: site
          configMap:
            name: download-site
---
apiVersion: v1
kind: Service
metadata:
  name: download
  namespace: mpcpi
spec:
  selector:
    app: download
  ports:
    - port: 80
      targetPort: 80
---
# Same TLS shape as the cluster's other public ingresses: cert-manager
# letsencrypt-prod certificate, Traefik websecure entrypoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: download
  namespace: mpcpi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: mpc.jegor.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: download
                port:
                  number: 80
  tls:
    - hosts: [mpc.jegor.nl]
      secretName: mpcpi-download-tls
